name: Database

# Applies new migrations in supabase/migrations to the hosted Supabase project, then
# regenerates types/database.ts from the real database and commits it if it changed.
# Secrets (repo → Settings → Secrets → Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF,
# SUPABASE_DB_PASSWORD.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db.yml"
  workflow_dispatch:

# Never run two migrations at the same time, and never cancel one halfway.
concurrency:
  group: database
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_YES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check secrets are set
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done

      # The schema tests must pass before anything touches the real database.
      - name: Schema tests
        run: npx vitest run supabase

      - name: Migration status (before)
        run: npx supabase migration list --remote="$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: npx supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Migration status (after)
        run: npx supabase migration list --remote="$SUPABASE_PROJECT_REF"

      - name: Regenerate types
        run: |
          npx supabase gen types --lang=typescript --schema public --remote="$SUPABASE_PROJECT_REF" > types/database.ts.new
          test -s types/database.ts.new
          mv types/database.ts.new types/database.ts
          npx prettier --write types/database.ts
          git diff --stat -- types/database.ts
          git diff -- types/database.ts

      - name: Commit types if they changed
        run: |
          if git diff --quiet -- types/database.ts; then
            echo "Types are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add types/database.ts
          git commit -m "chore(db): regenerate database types"
          git push
